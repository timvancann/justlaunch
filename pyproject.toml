[project]
name = "justlaunch"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Tim van Cann", email = "timvancann@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "rich>=14.2.0",
    "textual>=6.11.0",
    "textual-serve>=1.0.0",
    "rapidfuzz>=3.0.0",
    "loguru>=0.7.2",
]

[project.scripts]
jl = "jl.tui:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jl"]

[dependency-groups]
dev = ["textual-dev>=1.8.0", "pytest-asyncio>=1.3.0", "pytest>=9.0.2"]
